<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Management Avanzato</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #0f172a; /* Sfondo scuro elegante */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        .container {
            width: 100%;
            max-width: 800px;
            padding: 20px;
            text-align: center;
        }

        .banner-link {
            display: block;
            text-decoration: none;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .banner-link:active {
            transform: scale(0.98);
        }

        .banner-image {
            width: 100%;
            height: auto;
            display: block;
            object-fit: cover;
        }

        .instruction-text {
            margin-top: 20px;
            color: #ffffff;
            font-size: 1.2rem;
            font-weight: bold;
            letter-spacing: 1px;
            text-transform: uppercase;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
        }

        /* Adattamento per schermi piccoli (smartphone) */
        @media (max-width: 600px) {
            .instruction-text {
                font-size: 1rem;
                margin-top: 15px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <a href="https://forpin.it/corsi/project-management-avanzato-2/" class="banner-link" target="_blank" rel="noopener noreferrer">
            <img src="home-project.jpg" alt="Project Management Avanzato - Forpin" class="banner-image">
        </a>
        <p class="instruction-text">CLICCA SULLA FOTO PER VEDERE IL CORSO</p>
    </div>

</body>
</html>
